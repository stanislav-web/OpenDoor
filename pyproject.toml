[build-system]
# Modern Python packaging baseline for 2026.
# This keeps the current setup.py workflow working,
# but allows modern tools like `pip`, `build`, and PyPI backends
# to treat the project as a standard PEP 517/518 package.
requires = [
    "setuptools>=82.0.1",
    "wheel>=0.47.0"
]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E721",
    "E722",
    "F632",
]

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = [
    "F401", # package re-exports / legacy public aliases
]
"tests/**/*.py" = [
    "F401",
]
".github/**/*.py" = [
    "ARG001",
    "ARG002",
    "ARG005",
]
"benchmarks/**/*.py" = [
    "B009",
    "B010",
    "RET501",
    "SIM108",
]

[tool.ruff.format]
docstring-code-format = true
name: Publish Chocolatey package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v5.18.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-chocolatey:
    name: Publish Chocolatey package
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}

    steps:
      - name: Resolve release version
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "Release tag is empty. Use a tag like v5.18.0."
          }

          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like v5.18.0. Got: $env:RELEASE_TAG"
          }

          $packageVersion = $env:RELEASE_TAG.Substring(1)
          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Release tag: $env:RELEASE_TAG"
          Write-Host "Package version: $packageVersion"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: Verify Chocolatey metadata
        shell: pwsh
        run: |
          $nuspecPath = ".\chocolatey\opendoor.nuspec"

          if (-not (Test-Path $nuspecPath)) {
            throw "Chocolatey nuspec not found: $nuspecPath"
          }

          [xml]$nuspec = Get-Content $nuspecPath
          $actualVersion = $nuspec.package.metadata.version

          if ($actualVersion -ne $env:PACKAGE_VERSION) {
            throw "Nuspec version mismatch. Expected $env:PACKAGE_VERSION, got $actualVersion."
          }

          Select-String -Path $nuspecPath -Pattern $env:RELEASE_TAG -SimpleMatch

      - name: Show Chocolatey version
        shell: pwsh
        run: choco --version

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\chocolatey\dist | Out-Null

          choco pack .\chocolatey\opendoor.nuspec --outputdirectory .\chocolatey\dist

          $packagePath = ".\chocolatey\dist\opendoor.$env:PACKAGE_VERSION.nupkg"

          if (-not (Test-Path $packagePath)) {
            throw "Expected package was not created: $packagePath"
          }

          Get-ChildItem .\chocolatey\dist
          "PACKAGE_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Push Chocolatey package
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw "Missing CHOCOLATEY_API_KEY repository secret."
          }

          choco push $env:PACKAGE_PATH --source="'https://push.chocolatey.org/'" --api-key="'$env:CHOCOLATEY_API_KEY'"
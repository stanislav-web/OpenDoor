name: Package Manager Checks

on:
  workflow_dispatch:
    inputs:
      check_chocolatey:
        description: "Run Chocolatey package check on Windows"
        required: true
        type: boolean
        default: true
      check_homebrew:
        description: "Run Homebrew package check on macOS"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  chocolatey:
    name: Chocolatey package check
    if: ${{ inputs.check_chocolatey }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show Chocolatey and Python versions
        shell: pwsh
        run: |
          choco --version
          python --version
          python -m pip --version

      - name: Validate Chocolatey metadata version
        shell: pwsh
        run: |
          [xml]$nuspec = Get-Content "chocolatey/opendoor.nuspec"
          $nuspecVersion = $nuspec.package.metadata.version.Trim()
          $projectVersion = (Get-Content "VERSION" | Select-Object -First 1).Trim()

          if ($nuspecVersion -ne $projectVersion) {
            throw "Chocolatey nuspec version '$nuspecVersion' does not match VERSION '$projectVersion'."
          }

          "OPENDOOR_PACKAGE_VERSION=$projectVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OpenDoor package version: $projectVersion"

      - name: Build local Python artifacts for installer smoke test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

          $wheel = Get-ChildItem "dist" -Filter "opendoor-*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "OpenDoor wheel was not built."
          }

          "OPENDOOR_CHOCOLATEY_PIP_SPEC=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Chocolatey install smoke test will use local wheel: $($wheel.FullName)"

      - name: Add Python Scripts directory to PATH
        shell: pwsh
        run: |
          $scriptsDir = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          if (-not (Test-Path $scriptsDir)) {
            throw "Python Scripts directory was not found: $scriptsDir"
          }

          $scriptsDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Added to PATH: $scriptsDir"

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          cd chocolatey
          choco pack

          $nupkg = Get-ChildItem -Filter "opendoor.*.nupkg" | Select-Object -First 1
          if (-not $nupkg) {
            throw "Chocolatey package was not created."
          }

          Write-Host "Created Chocolatey package: $($nupkg.FullName)"

      - name: Install Chocolatey package from local source
        shell: pwsh
        run: |
          cd chocolatey

          choco install opendoor `
            --yes `
            --no-progress `
            --source "$PWD" `
            --version "$env:OPENDOOR_PACKAGE_VERSION" `
            --ignore-dependencies

          opendoor --version
          opendoor --help

      - name: Uninstall Chocolatey package
        if: always()
        shell: pwsh
        run: |
          choco uninstall opendoor --yes --no-progress

  homebrew:
    name: Homebrew package check
    if: ${{ inputs.check_homebrew }}
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Homebrew version
        run: |
          brew --version
          brew config

      - name: Install OpenDoor from Homebrew
        run: |
          brew update
          brew install opendoor

      - name: Smoke test Homebrew OpenDoor install
        run: |
          which opendoor
          opendoor --version
          opendoor --help
          brew test opendoor

      - name: Uninstall Homebrew OpenDoor package
        if: always()
        run: |
          brew uninstall opendoor || true

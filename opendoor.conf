[general]

# Target host or IP <string>
host = example.com

# Target scheme: http:// or https:// <string>
scheme = http://

# Custom port <int>
# OpenDoor derives HTTP vs HTTPS transport from scheme.
# Recommended alignment:
# - scheme=http://  -> port=80
# - scheme=https:// -> port=443
port = 80

# HTTP method.
# HEAD is faster, but body-dependent sniffers/filters force GET internally.
method = HEAD

# Delay between threaded requests in seconds.
# Wizard currently parses integers safely, so prefer 0,1,2... here.
delay = 0

# Request timeout in seconds <int>
timeout = 30

# Max retries to reconnect <int>
retries = 3

# Use keep-alive connection.
# IMPORTANT for wizard: use True to enable, None to disable.
# Do not use False here, current BrowserConfig treats non-None as enabled.
keep_alive = None

# Accept and route cookies from responses.
# IMPORTANT for wizard: use True to enable, None to disable.
# Do not use False here, current BrowserConfig treats non-None as enabled.
accept_cookies = None

# Detect probable CMS, framework, platform, security posture and passive privacy risks before scan <bool>
fingerprint = False

# Passively detect probable WAF / anti-bot protections <bool>
waf_detect = False

# Enable cautious WAF-aware runtime profile.
# Automatically enables WAF detection inside BrowserConfig.
waf_safe_mode = False

# Enable controlled Header Injection Bypass probes.
# This is strict opt-in and only probes configured blocked statuses.
# Probe headers are temporary per-request headers and do not mutate global headers.
# Use only on systems you own or have explicit permission to test.
header_bypass = False

# Header-bypass profile: safe or offensive.
# safe keeps the stable default header family.
# offensive adds extended proxy/CDN/client-IP/method/scheme headers and trusted IP values.
header_bypass_profile = safe

# Comma-separated header names used by Header Injection Bypass.
# Default None uses the built-in stable header family.
# Examples:
# header_bypass_headers = X-Original-URL,X-Rewrite-URL,X-Forwarded-For,X-Real-IP
header_bypass_headers = None

# Comma-separated trusted IP values used by trusted-IP style bypass headers.
# Default None uses the built-in stable trusted IP values.
# Examples:
# header_bypass_ips = 127.0.0.1,10.0.0.1,192.168.1.1
header_bypass_ips = None

# Comma-separated HTTP status codes or ranges that trigger header-bypass probes.
# Default None uses: 401,403
# Examples:
# header_bypass_status = 401,403
# header_bypass_status = 401-403
header_bypass_status = None

# Maximum header-bypass variants per blocked URL.
# Default: 32
# Use 0 for unlimited variants.
header_bypass_limit = 32

# Enable smart auto-calibration for soft-404, wildcard and catch-all responses.
# This is opt-in and does not change default scan behaviour when disabled.
# Auto-calibration uses body analysis, so HEAD is overridden to GET when enabled.
auto_calibrate = False

# Number of random calibration probes before scan <int>
calibration_samples = 5

# Calibration match threshold from 0.01 to 1.0 <float>
# Higher values are stricter and reduce false filtering.
calibration_threshold = 0.92

# Enable CI/CD fail-on mode by selected result buckets.
# When at least one selected bucket is found, OpenDoor exits with code 1.
# Default None keeps the regular scan exit behaviour unchanged.
#
# Common buckets:
# - success    discovered valid resources
# - auth       authentication-required resources
# - forbidden 403-like restricted resources
# - blocked   WAF / anti-bot blocked responses
# - bypass    header-injection bypass candidates
#
# Example:
# fail_on_bucket = success,auth,forbidden,blocked,bypass
fail_on_bucket = None

# Use built-in proxy list <bool>
proxy_pool = False

# Path to custom proxy list <string|None>
proxy_list = None

# Custom permanent proxy server.
# Format: http://ip:port, https://ip:port, socks4://ip:port, socks5://ip:port
proxy = None

# Network transport mode.
# Supported:
# - direct    default OS route
# - proxy     existing HTTP/SOCKS proxy layer
# - openvpn   OpenVPN profile through OS routing
# - wireguard WireGuard profile through wg-quick
transport = direct

# Single transport profile path.
# OpenVPN: *.ovpn
# WireGuard: *.conf
transport_profile = None

# Text file with transport profile paths, one per line.
transport_profiles = None

# Transport rotation mode.
# Supported:
# - none
# - per-target
transport_rotate = none

# Seconds to wait for transport commands.
transport_timeout = 30

# Optional transport executable path or command name.
# Default None means OpenDoor searches PATH plus common OS-specific locations.
# Examples:
# transport_bin = /opt/homebrew/sbin/openvpn
# transport_bin = C:\Program Files\OpenVPN\bin\openvpn.exe
transport_bin = None

# Optional URL used to verify connectivity after transport startup.
transport_healthcheck_url = None

# Optional auth-user-pass file for OpenVPN only.
openvpn_auth = None

# Randomize User-Agent per request <bool>
random_agent = False

# Debug level: -1 quiet, 0 normal, 1 scan decisions, 2 requests, 3 responses/classification <int>
debug = 0

# Allowed worker threads <int>
threads = 1

# Response sniff plugins.
# Supported examples:
# - indexof
# - collation
# - file
# - skipempty
# - skipsizes=46
# - skipsizes=46:1024
# - stacktrace
# - secret
# - openredirect
# Multiple: secret,openredirect,stacktrace,skipempty,collation,indexof
sniff = None

# Scan type: directories or subdomains <string>
scan = directories

# Path to custom wordlist <string|None>
wordlist = None

# Shuffle scan list.
# IMPORTANT for wizard: use True to enable, None to disable.
# Do not use False here, current BrowserConfig treats non-None as enabled.
random_list = None

# Append path prefix to scan host.
# Example: admin, api/v1, app/
prefix = None

# Force selected extensions for directory scan.
# Example: php,json,txt
extensions = None

# Ignore selected extensions for directory scan.
# Example: aspx,jsp,do
ignore_extensions = None

# Enable recursive directory scan <bool>
recursive = False

# Maximum recursive scan depth <int>
recursive_depth = 1

# HTTP statuses allowed for recursive expansion <string>
recursive_status = 200,301,302,307,308,403

# File extensions excluded from recursive expansion <string>
recursive_exclude = jpg,jpeg,png,gif,svg,css,js,ico,woff,woff2,ttf,map,pdf,zip,gz,tar

# Scan reports.
# Supported: json,std,txt,csv,html,sqlite,sarif
# For CSV reporter check use: std,csv
# Header-bypass and debug-detection metadata are preserved in json,html,csv,sqlite and sarif reports.
# CSV and SQLite expose dedicated bypass and debug-detection fields.
reports = std,html

# Path to custom reports directory <string|None>
reports_dir = None

# Persist scan state to checkpoint file.
# Sessions currently support one target per run.
session_save = None

# Resume scan from checkpoint file.
# If set, session params override host/scan settings.
session_load = None

# Autosave session checkpoint every N seconds <int>
session_autosave_sec = 20

# Autosave session checkpoint after N processed items <int>
session_autosave_items = 200

# Include only response codes.
# Example: 200-299,301,302,403
include_status = None

# Exclude response codes.
# Example: 404,429,500-599
exclude_status = None

# Exclude exact response sizes in bytes.
# Example: 0,1234
exclude_size = None

# Exclude response size ranges in bytes.
# Example: 0-256,1024-2048
exclude_size_range = None

# Keep only responses whose body contains this text.
# Body-dependent filter: HEAD will be overridden to GET.
match_text = None

# Exclude responses whose body contains this text.
# Body-dependent filter: HEAD will be overridden to GET.
exclude_text = None

# Keep only responses whose body matches this regex.
# Body-dependent filter: HEAD will be overridden to GET.
match_regex = None

# Exclude responses whose body matches this regex.
# Body-dependent filter: HEAD will be overridden to GET.
exclude_regex = None

# Keep only responses whose size is at least N bytes <int|None>
min_response_length = None

# Keep only responses whose size is at most N bytes <int|None>
max_response_length = None
